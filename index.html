<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boodschappen">
<meta name="theme-color" content="#EEF3F0">
<title>Onze boodschappen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --ink:#16211C; --muted:#5E6E66; --line:#D6E0DA;
  --accent:#0E7A5D; --accent-ink:#FFFFFF; --accent-soft:#D9EEE6; --warn:#B4412F; --done:#8A9A92;
  --display:"Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101714; --surface:#18221D; --ink:#E4EDE8; --muted:#94A69C; --line:#2A3831;
    --accent:#3DBB8F; --accent-ink:#08130E; --accent-soft:#1F3A2F; --warn:#E8826F; --done:#667870;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101714; --surface:#18221D; --ink:#E4EDE8; --muted:#94A69C; --line:#2A3831;
  --accent:#3DBB8F; --accent-ink:#08130E; --accent-soft:#1F3A2F; --warn:#E8826F; --done:#667870;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:560px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:18px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
h1{font:800 1.75rem/1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.link.share{color:var(--accent)}
.status{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.live .dot{background:var(--accent)}
.status.local .dot{background:var(--warn)}
form.add{display:flex;gap:8px}
#newItem{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
#newItem:focus{outline:none;border-color:var(--accent)}
.btn{font:600 1rem var(--body);border:0;border-radius:12px;padding:0 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:focus-visible,.icon:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:.82rem;color:var(--muted);min-height:1.2em}
.hint b{color:var(--accent);font-weight:600}
.hint.err{color:var(--warn)}
.summary{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

section.aisle{margin-top:18px}
.aisle h2{display:flex;align-items:baseline;gap:10px;margin:0 0 6px;font:600 .95rem var(--display);letter-spacing:.01em}
.aisle h2 .nr{font:800 .72rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-variant-numeric:tabular-nums;min-width:3.4em}
.aisle h2 .ct{margin-left:auto;font:500 .78rem var(--body);color:var(--muted)}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li{display:flex;align-items:center;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.row{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:13px 12px;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.box{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.name{overflow-wrap:anywhere}
li.done .box{background:var(--accent);border-color:var(--accent)}
li.done .box::after{content:"";width:10px;height:5px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
li.done .name{color:var(--done);text-decoration:line-through}
.tools{display:flex;align-items:center;padding-right:6px}
.icon{position:relative;width:36px;height:36px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:8px;cursor:pointer}
.icon:hover{background:var(--accent-soft);color:var(--ink)}
.icon svg{width:18px;height:18px}
.icon select{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:16px}

.basket{margin-top:28px}
.basket .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.basket h2{margin:0;font:600 .95rem var(--display);color:var(--muted)}
.link{font:600 .85rem var(--body);background:none;border:0;color:var(--warn);cursor:pointer;padding:6px 0}
.confirm{display:flex;gap:8px;align-items:center;font-size:.85rem}
.confirm button{font:600 .85rem var(--body);border-radius:8px;padding:6px 10px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.confirm .yes{background:var(--warn);border-color:var(--warn);color:#fff}

.empty{margin-top:28px;padding:22px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);font-size:.95rem}
.empty p{margin:0 0 8px}.empty p:last-child{margin:0}
.empty code{font-family:var(--body);font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){ li{transition:background .15s} }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1>Boodschappen</h1>
      <span class="meta"><span class="status" id="status"><span class="dot"></span><span id="statusText">Verbinden…</span></span><button class="link share" id="share" type="button">Deel link</button></span>
    </div>
    <form class="add" id="addForm" autocomplete="off">
      <input id="newItem" type="text" placeholder="Wat moet er mee? bv. 2 pakken melk" aria-label="Nieuw product" enterkeyhint="done">
      <button class="btn" type="submit">Zet erop</button>
    </form>
    <div class="hint" id="hint">&nbsp;</div>
  </header>

  <div class="summary" id="summary"></div>
  <main id="list"></main>
</div>

<script src="config.js"></script>
<script type="module">
import * as F from "./firebase.js";
// ---------- Winkelindeling: volgorde van een gemiddelde AH-looproute ----------
const AISLES = [
  ["groente","Groente & fruit"],["brood","Brood & bakkerij"],["vlees","Vlees, vis & vega"],
  ["kaas","Kaas, vleeswaren & tapas"],["zuivel","Zuivel & eieren"],["maaltijd","Verse maaltijden & salades"],
  ["ontbijt","Ontbijt & beleg"],["pasta","Pasta, rijst & wereldkeuken"],["conserven","Soepen, sauzen & conserven"],
  ["bakken","Bakken, olie & kruiden"],["koffie","Koffie & thee"],["snoep","Koek, snoep & chips"],
  ["drank","Frisdrank & sap"],["alcohol","Bier & wijn"],["diepvries","Diepvries"],
  ["drogist","Drogisterij"],["huishoud","Huishouden & dier"],["overig","Overig"]
];
const AISLE_INDEX = Object.fromEntries(AISLES.map(([id],i)=>[id,i]));
const AISLE_LABEL = Object.fromEntries(AISLES);

const KEYWORDS = {
  groente:"appel appels peer peren banaan bananen sinaasappel sinaasappels mandarijn mandarijnen citroen citroenen limoen limoenen druiven aardbei aardbeien blauwe bessen bessen frambozen kiwi kiwis mango ananas avocado avocados meloen watermeloen tomaat tomaten cherrytomaten komkommer paprika paprikas ui uien rode ui knoflook wortel wortels worteltjes peen sla ijsbergsla rucola veldsla spinazie andijvie broccoli bloemkool courgette aubergine prei champignons champignon paddenstoelen aardappel aardappelen aardappels krieltjes zoete aardappel sperziebonen boontjes boerenkool spruitjes rode kool witlof gember bosui lente-ui peterselie basilicum koriander bieslook dille munt radijs radijsjes bietjes rode biet bleekselderij selderij venkel pompoen fruit groente groenten snijbonen pepers asperges nectarine perzik pruimen granaatappel spitskool wokgroente",
  brood:"brood volkoren wit brood bruin brood bolletjes broodjes croissant croissants stokbrood wraps wrap pita pitabroodjes beschuit crackers krentenbollen krentenbol afbakbrood tijgerbrood knackebrod toast pistolets naan bagels bagel tortillawraps",
  vlees:"vlees gehakt rundergehakt kip kipfilet kippendijen kippendij kippenpoten biefstuk varkenshaas speklapjes spekjes spek rookworst braadworst worstjes hamburger hamburgers schnitzel shoarma kipshoarma vis zalm zalmfilet kabeljauw pangasius garnalen mosselen vegaburger vegaburgers vega vegetarisch gehakt tofu tempeh gehaktballen lamsvlees rundvlees stoofvlees spareribs saté sate slavinken kipgehakt",
  kaas:"kaas plakken kaas geraspte kaas mozzarella parmezaan parmezaanse kaas feta brie camembert geitenkaas hummus ham salami rosbief filet americain chorizo olijven tapas smeerkaas roomkaas boursin cervelaat kipfilet beleg leverworst pate",
  zuivel:"melk halfvolle melk volle melk karnemelk yoghurt griekse yoghurt kwark vla boter roomboter margarine room slagroom kookroom creme fraiche zure room eieren ei skyr havermelk sojamelk amandelmelk alpro toetje toetjes pudding chocolademelk drinkyoghurt",
  maaltijd:"salade maaltijdsalade verse pasta lasagne stamppot maaltijd sushi wraps kant-en-klaar verse soep pastasalade",
  ontbijt:"pindakaas hagelslag jam honing chocopasta nutella muesli cruesli granola havermout cornflakes ontbijtkoek ontbijtgranen speculoospasta appelstroop vlokken chocoladevlokken muisjes cereals",
  pasta:"pasta spaghetti penne macaroni fusilli tagliatelle lasagnebladen rijst basmati zilvervliesrijst noedels mie couscous bulgur quinoa tortilla tortillas taco tacos nasi bami woksaus sojasaus ketjap sambal kokosmelk curry currypasta boemboe kroepoek mexicaans risotto gnocchi",
  conserven:"soep bouillon bouillonblokjes tomatenblokjes passata tomatenpuree pastasaus saus mayonaise mayo ketchup mosterd kidneybonen bruine bonen witte bonen kikkererwten linzen mais tonijn blik augurken augurk zilveruitjes appelmoes pesto dressing slasaus knakworst knakworstjes jus satesaus",
  bakken:"bloem meel zelfrijzend bakmeel suiker poedersuiker bakpoeder gist olie olijfolie zonnebloemolie azijn balsamico zout peper kruiden oregano paprikapoeder kaneel nootmuskaat komijn vanille vanillesuiker cacao pannenkoekmix cakemix paneermeel maizena",
  koffie:"koffie koffiebonen cups capsules pads koffiepads thee theezakjes cappuccino koffiemelk koffiefilters oploskoffie",
  snoep:"koek koekjes biscuit biscuitjes stroopwafels chocolade chocola reep snoep drop chips nootjes noten pinda pindas borrelnootjes popcorn rozijnen cashewnoten amandelen walnoten kauwgom repen mueslirepen snoepjes zoutjes crackers borrel",
  drank:"water spa bruisend water mineraalwater cola fris frisdrank sap jus d'orange sinaasappelsap appelsap limonade siroop ice tea icetea energy tonic ranja smoothie cassis sportdrank",
  alcohol:"bier wijn rode wijn witte wijn rose prosecco cava champagne pils speciaalbier gin whisky rum wodka radler alcoholvrij bier",
  diepvries:"diepvries ijs ijsjes pizza pizzas friet patat frites diepvriesgroente doperwten vissticks kroketten bitterballen ijsblokjes loempia loempias magnum diepvriesfruit",
  drogist:"tandpasta tandenborstel shampoo conditioner douchegel zeep handzeep deodorant deo scheermesjes scheerschuim maandverband tampons luiers billendoekjes paracetamol ibuprofen pleisters zonnebrand bodylotion watten wattenstaafjes lenzenvloeistof vitamines condooms mondwater flosdraad nagellak dagcreme",
  huishoud:"wc-papier wcpapier toiletpapier keukenrol keukenpapier tissues zakdoekjes afwasmiddel vaatwastabletten vaatwas wasmiddel wasverzachter schoonmaakmiddel allesreiniger sponsjes sponzen vuilniszakken afvalzakken aluminiumfolie huishoudfolie bakpapier boterhamzakjes diepvrieszakjes batterijen kaarsen lampje kattenvoer hondenvoer kattenbakvulling kattenbak vogelzaad ontkalker glasreiniger bleek chloor ajax ariel dreft robijn omo sunlight glorix cillit vanish witte reus finish wc-eend wc-blok vaatdoekje vaatdoek theedoek handschoenen"
};

function norm(s){
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[-']/g,"").replace(/\s+/g," ").trim();
}
// "2 pakken melk", "500g gehakt", "melk x2" → "melk"
function baseName(s){
  let n = norm(s);
  n = n.replace(/^\d+([.,]\d+)?\s*(x|st|stuks|kg|g|gr|gram|l|liter|ml|cl|pak|pakken|zak|zakken|fles|flessen|blik|blikken|bak|bakjes|potten|pot)?\s+/,"");
  n = n.replace(/\s+(x\s*\d+|\d+\s*x|\(\d+\)|\d+)$/,"");
  return n.trim();
}

// Longest keyword that appears in the name wins, so "pindakaas" beats "kaas"
// and "sinaasappelsap" beats "sinaasappel". Keywords of 3 letters or fewer
// only count as whole words ("ui" mag niet matchen in "fruit").
const KW = [];
for (const [aisle, list] of Object.entries(KEYWORDS)) {
  const words = list.split(" ");
  // two-word keywords are listed as neighbours; also test each pair
  for (let i=0;i<words.length;i++){
    KW.push([norm(words[i]), aisle]);
    if (i+1<words.length) KW.push([norm(words[i]+" "+words[i+1]), aisle, true]);
  }
}
function guessAisle(name){
  const n = baseName(name);
  if (learned[n]) return learned[n];
  const padded = " "+n+" ";
  let best=null, bestLen=0;
  for (const [kw, aisle, pair] of KW){
    if (kw.length<=bestLen) continue;
    if (pair && !padded.includes(" "+kw+" ")) continue;
    const hit = kw.length<=3 ? padded.includes(" "+kw+" ") : n.includes(kw);
    if (hit){ best=aisle; bestLen=kw.length; }
  }
  return best || "overig";
}

// ---------- State ----------
let items = [];          // {id, name, aisle, done, addedAt, doneAt}
let learned = {};        // baseName → aisle, gedeeld zodat jullie allebei profiteren
let mode = "connecting"; // "live" | "offline" | "error"
let fs = null, listPath = null, confirmClear = false;
const $ = s => document.querySelector(s);

function setStatus(){
  const el=$("#status"), t=$("#statusText");
  el.className = "status "+(mode==="live"?"live":mode==="connecting"?"":"local");
  t.textContent = {live:"Gedeeld · live", offline:"Offline · synct later", error:"Niet verbonden", connecting:"Verbinden…"}[mode];
}
function flash(html, err){
  const h=$("#hint"); h.innerHTML=html; h.classList.toggle("err",!!err);
  clearTimeout(flash.t); flash.t=setTimeout(()=>{h.innerHTML="&nbsp;";h.classList.remove("err")}, err?8000:3500);
}
function explain(e){
  const c = e && e.code;
  if (c==="permission-denied") return "De database weigert deze wijziging. Kloppen de regels in Firebase (zie README)?";
  if (c==="resource-exhausted") return "Het gratis dagquotum van Firebase is op. Morgen werkt het weer.";
  if (c==="unavailable") return "Geen verbinding. Je wijziging wordt verstuurd zodra je weer online bent.";
  return "Opslaan lukte niet ("+(c||"onbekende fout")+"). Probeer het opnieuw.";
}
async function guard(p){ try{ await p; } catch(e){ console.error(e); flash(explain(e), true); } }

// ---------- Mutations ----------
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const itemRef = id => F.doc(fs, listPath, "items", id);
const aislesRef = () => F.doc(fs, listPath, "meta", "aisles");

async function addItem(raw){
  const name = raw.trim().replace(/\s+/g," ");
  if (!name || !fs) return;
  const key = baseName(name);
  if (items.some(i=>!i.done && baseName(i.name)===key)){ flash("<b>"+esc(name)+"</b> staat al op de lijst."); return; }
  const aisle = guessAisle(name);
  flash("<b>"+esc(name)+"</b> → "+AISLE_LABEL[aisle]+(aisle==="overig"?". Tik op de pijltjes om een pad te kiezen.":""));
  await guard(F.setDoc(itemRef(uid()), {name, aisle, done:false, addedAt:Date.now(), doneAt:null}));
}
async function toggle(id){
  const it = items.find(i=>i.id===id); if(!it) return;
  await guard(F.updateDoc(itemRef(id), {done:!it.done, doneAt:it.done?null:Date.now()}));
}
async function removeItem(id){ await guard(F.deleteDoc(itemRef(id))); }
async function moveItem(id, aisle){
  const it = items.find(i=>i.id===id); if(!it) return;
  flash("<b>"+esc(it.name)+"</b> staat voortaan bij "+AISLE_LABEL[aisle]+".");
  await guard(F.updateDoc(itemRef(id), {aisle}));
  await guard(F.setDoc(aislesRef(), {map:{[baseName(it.name)]:aisle}}, {merge:true}));
}
async function clearDone(){
  const done = items.filter(i=>i.done);
  confirmClear=false; render();
  const batch = F.writeBatch(fs);
  done.forEach(i=>batch.delete(itemRef(i.id)));
  await guard(batch.commit());
}

// ---------- Render ----------
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const ICON_MOVE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 3.5 7.5M7 4l3.5 3.5M17 20V4m0 16-3.5-3.5M17 20l3.5-3.5"/></svg>';
const ICON_X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const OPTIONS = AISLES.map(([id,l])=>`<option value="${id}">${l}</option>`).join("");

function itemRow(it){
  return `<li class="${it.done?"done":""}" data-id="${esc(it.id)}">
    <button class="row" data-act="toggle" aria-pressed="${it.done}"><span class="box"></span><span class="name">${esc(it.name)}</span></button>
    <span class="tools">
      <label class="icon" title="Ander pad kiezen">${ICON_MOVE}<select data-act="move" aria-label="Pad voor ${esc(it.name)}">${OPTIONS.replace(`value="${it.aisle}"`,`value="${it.aisle}" selected`)}</select></label>
      <button class="icon" data-act="remove" title="Verwijderen" aria-label="${esc(it.name)} verwijderen">${ICON_X}</button>
    </span></li>`;
}

function render(){
  const open = items.filter(i=>!i.done);
  const done = items.filter(i=>i.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const groups = {};
  for (const it of open) (groups[it.aisle in AISLE_INDEX ? it.aisle : "overig"] ??= []).push(it);
  let html = "";
  if (!items.length){
    html = `<div class="empty"><p>De lijst is leeg. Typ bovenaan wat er mee moet, bijvoorbeeld <code>halfvolle melk</code>, <code>2 komkommers</code> of <code>wc-papier</code>.</p>
      <p>Alles wordt vanzelf gesorteerd in de volgorde waarin je door de winkel loopt: groente en fruit voorin, diepvries en huishoudspullen achterin.</p></div>`;
  } else {
    for (const [id,label] of AISLES){
      const g = groups[id]; if (!g) continue;
      g.sort((a,b)=>a.addedAt-b.addedAt);
      html += `<section class="aisle"><h2><span class="nr">${id==="overig"?"Overig":"Pad "+(AISLE_INDEX[id]+1)}</span><span>${id==="overig"?"Nog geen pad":label}</span><span class="ct">${g.length}</span></h2><ul>${g.map(itemRow).join("")}</ul></section>`;
    }
    if (!open.length) html += `<div class="empty"><p>Alles is gepakt. Wis het mandje hieronder om met een schone lijst te beginnen.</p></div>`;
    if (done.length){
      html += `<section class="basket"><div class="head"><h2>In het mandje · ${done.length}</h2>${
        confirmClear
        ? `<span class="confirm">${done.length} wissen? <button class="yes" data-act="clear-yes">Wissen</button><button data-act="clear-no">Annuleer</button></span>`
        : `<button class="link" data-act="clear">Mandje leegmaken</button>`}</div><ul>${done.map(itemRow).join("")}</ul></section>`;
    }
  }
  $("#list").innerHTML = html;
  $("#summary").textContent = items.length ? `${open.length} nog te halen · ${done.length} gepakt` : "";
}

// ---------- Events ----------
$("#addForm").addEventListener("submit", e=>{
  e.preventDefault(); const inp=$("#newItem"); const v=inp.value; inp.value=""; addItem(v); inp.focus();
});
$("#list").addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b || b.tagName==="SELECT") return;
  const id = b.closest("li")?.dataset.id, act=b.dataset.act;
  if (act==="toggle") toggle(id);
  else if (act==="remove") removeItem(id);
  else if (act==="clear"){ confirmClear=true; render(); }
  else if (act==="clear-no"){ confirmClear=false; render(); }
  else if (act==="clear-yes") clearDone();
});
$("#list").addEventListener("change", e=>{
  if (e.target.dataset.act==="move") moveItem(e.target.closest("li").dataset.id, e.target.value);
});

// ---------- Lijstcode ----------
// De code in de link (#…) is de sleutel tot jullie lijst. Wie de link heeft kan
// meeschrijven; zonder de link is de lijst niet te vinden.
function listCode(){
  let code = location.hash.slice(1);
  if (!/^[a-z0-9]{20,}$/.test(code)){
    try { code = localStorage.getItem("lijstcode") || ""; } catch { code = ""; }
    if (!/^[a-z0-9]{20,}$/.test(code)){
      const a = crypto.getRandomValues(new Uint8Array(24));
      code = Array.from(a, b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
    }
    history.replaceState(null, "", "#"+code);
  }
  try { localStorage.setItem("lijstcode", code); } catch {}
  return code;
}
$("#share").addEventListener("click", async ()=>{
  const url = location.href;
  if (navigator.share) { try { await navigator.share({title:"Onze boodschappen", url}); return; } catch(e){ if (e.name==="AbortError") return; } }
  try { await navigator.clipboard.writeText(url); flash("Link gekopieerd. Stuur hem naar Pien."); }
  catch { flash("Kopieer deze link: <b>"+esc(url)+"</b>"); }
});

// ---------- Boot ----------
render();
const cfg = window.FIREBASE_CONFIG;
if (!cfg || !cfg.projectId || cfg.projectId.startsWith("VUL")){
  mode="error"; setStatus();
  $("#list").innerHTML = '<div class="empty"><p>Nog niet gekoppeld aan een database. Vul <code>config.js</code> in met de gegevens uit Firebase (zie README).</p></div>';
} else {
  const app = F.initializeApp(cfg);
  fs = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})});
  listPath = "lists/"+listCode();
  F.onSnapshot(F.collection(fs, listPath, "items"), {includeMetadataChanges:true}, snap=>{
    items = snap.docs.map(d=>({id:d.id, ...d.data()}));
    mode = snap.metadata.fromCache ? "offline" : "live"; setStatus();
    render();
  }, err=>{ console.error(err); mode="error"; setStatus(); flash(explain(err)+" Herlaad de pagina.", true); });
  F.onSnapshot(aislesRef(), snap=>{ learned = (snap.exists() && snap.data().map) || {}; }, ()=>{});
}

</script>
</body>
</html>
